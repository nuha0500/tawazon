<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>توازن | المتوسطة الرابعة والثانوية الثانية مسارات بالرس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0; --ink:#1F2A44; --ink-soft:#5B6478; --teal:#0F766E; --teal-deep:#0B5750;
    --gold:#C89B3C; --amber:#D97706; --red:#DC2626; --line:#E4DDD0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif}
  h1,h2,.display{font-family:'Cairo',sans-serif}
  #root{min-height:100vh;display:flex;flex-direction:column}
  header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;background:#fff;border-bottom:1px solid var(--line);padding:16px 24px}
  .school-name{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .body-row{flex:1;display:flex}
  .spine{width:44px;background:linear-gradient(180deg,var(--teal),var(--teal-deep));display:flex;flex-direction:column;align-items:center;padding-top:24px;gap:40px;flex-shrink:0}
  .spine span{writing-mode:vertical-rl;color:var(--paper);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;opacity:.85}
  .main{flex:1;padding:28px 32px 60px;max-width:1100px;margin:0 auto;width:100%}
  .eyebrow{font-size:13px;color:var(--teal);font-weight:700;margin-bottom:4px}
  .title{font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;margin:0;color:var(--ink)}
  .userbox{display:flex;align-items:center;gap:14px}
  .userinfo{display:flex;flex-direction:column;align-items:flex-end}
  .username{font-weight:700;font-size:14px}
  .userrole{font-size:12px;color:var(--ink-soft)}
  button{cursor:pointer;font-family:'Tajawal',sans-serif}
  .btn-ghost{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
  .btn-primary:disabled{opacity:.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .card-title{font-size:18px;font-weight:700;margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:500;margin-bottom:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--ink);background:var(--paper);width:100%}
  .list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
  .list-item-title{font-weight:700;font-size:14px}
  .list-item-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .icon-btn{background:transparent;border:none;color:var(--red);padding:6px;font-size:16px}
  .muted{color:var(--ink-soft);font-size:13.5px}
  .role-switch{display:flex;gap:8px;background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line)}
  .role-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);font-weight:500;font-size:14px}
  .role-pill.active{background:var(--teal);color:#fff}
  .type-row{display:flex;gap:8px}
  .type-pill{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:13px;font-weight:500}
  .type-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .login-wrap{min-height:calc(100vh - 66px);width:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;max-width:400px;width:100%}
  .mode-switch{display:flex;border-bottom:1px solid var(--line)}
  .mode-tab{flex:1;padding:10px 0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);font-weight:700;font-size:14px}
  .mode-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
  .error-banner{background:#FEE2E2;color:#991B1B;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px}
  .setup-banner{background:#FFF7E6;border:1px solid var(--gold);color:#7A5B14;padding:16px 18px;border-radius:10px;margin-bottom:20px;font-size:13.5px;line-height:1.9}
  .setup-banner code{background:#fff;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse}
  th{text-align:center;padding:8px 10px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
  td{text-align:center;padding:10px;border-bottom:1px solid #F0EBE0}
  .pulse-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .pulse-dot{border-radius:50%;transition:all .3s;margin:0 auto}
  .pulse-val{font-size:11px;color:var(--ink-soft)}
  .spin{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center}
</style>
</head>

const ADMIN_SIGNUP_CODE = "2nd-school";

function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) { return d.toISOString().slice(0, 10); }
function fmtLabel(d) { return d.toLocaleDateString("ar-SA", { day: "numeric", month: "short" }); }
function loadLevel(minutes, heavyCount) {
  if (heavyCount >= 2 || minutes > 120) return { label: "مرتفع", color: "#DC2626" };
  if (heavyCount === 1 || minutes > 60) return { label: "متوسط", color: "#C89B3C" };
  if (minutes > 0) return { label: "خفيف", color: "#0F766E" };
  return { label: "لا يوجد", color: "#C7C0AE" };
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Renders offscreen-safe content for html2canvas: some mobile browsers (notably
// iOS Safari) render blank canvases for elements positioned far outside the
// viewport. Instead, we place the content within the viewport (top-left) and
// hide it behind a fully opaque cover, then remove both once captured.
function mountCapturableEl(innerHTML) {
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;top:0;left:0;z-index:99998;background:#fff";
  el.innerHTML = innerHTML;
  const cover = document.createElement("div");
  cover.style.cssText = "position:fixed;inset:0;background:#FAF7F0;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;color:#0F766E;font-weight:700;font-size:14px";
  cover.textContent = "جارٍ تجهيز الملف…";
  document.body.appendChild(el);
  document.body.appendChild(cover);
  return { el, cover, remove() { el.remove(); cover.remove(); } };
}

// Only allow http(s) links to render as clickable — blocks javascript: and other unsafe schemes.
function safeUrl(url) {
  if (!url) return "";
  try {
    const u = new URL(url);
    return (u.protocol === "http:" || u.protocol === "https:") ? url : "";
  } catch (e) { return ""; }
}

// ---------------------------------------------------------------------
// App state + Firebase wiring
// ---------------------------------------------------------------------
const state = {
  screen: CONFIG_READY ? "loading" : "setup",
  authUser: null,
  profile: null,       // { name, role, classId }
  classes: [],          // [{id,label}]
  assignments: [],       // [{id,...}]
  loginMode: "login",
  loginRole: "teacher",
  draft: { name: "", email: "", password: "", classId: "", adminCode: "" },
  error: "",
  formError: "",
  saving: false,
  shareMsg: "",
};

let auth, db, unsubClasses, unsubAssignments;

if (CONFIG_READY) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();

  auth.onAuthStateChanged(async (user) => {
    state.authUser = user;
    if (!user) {
      teardownListeners();
      state.profile = null;
      state.screen = "login";
      state.saving = false;
      render();
      return;
    }
    if (user.isAnonymous) {
      // Anonymous session: attach listeners right away so the class list is
      // readable for the login-screen dropdown, even before a class is chosen.
      attachListeners();
      state.screen = (state.profile && state.profile.role === "family") ? "app" : "login";
      state.saving = false;
      render();
      return;
    }
    try {
      const snap = await db.collection("users").doc(user.uid).get();
      if (!snap.exists) {
        // profile wasn't written yet (rare race) — sign out to avoid a broken state
        await auth.signOut();
        return;
      }
      state.profile = snap.data();
      attachListeners();
      state.screen = "app";
    } catch (e) {
      state.error = "تعذر تحميل بيانات الحساب.";
      state.screen = "login";
      state.saving = false;
    }
    render();
  });
}

function attachListeners() {
  teardownListeners();
  unsubClasses = db.collection("classes").orderBy("label").onSnapshot(
    (qs) => { state.classes = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => { state.error = "تعذر تحميل قائمة الصفوف — تحققي من قواعد الأمان في Firestore."; render(); }
  );
  unsubAssignments = db.collection("assignments").orderBy("dueDate").onSnapshot(
    (qs) => { state.assignments = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => { state.error = "تعذر تحميل التكليفات — تحققي من قواعد الأمان في Firestore."; render(); }
  );
}
function teardownListeners() {
  if (unsubClasses) unsubClasses();
  if (unsubAssignments) unsubAssignments();
}

async function seedDefaultClassesIfEmpty() {
  const snap = await db.collection("classes").limit(1).get();
  if (snap.empty) {
    const batch = db.batch();
    DEFAULT_CLASSES.forEach((label) => batch.set(db.collection("classes").doc(), { label }));
    await batch.commit();
  }
}

const app = {
  async register(form) {
    state.formError = "";
    const { email, password, name, role, adminCode } = form;
    if (!email || !password || !name) { state.formError = "الرجاء تعبئة كل الحقول."; render(); return; }
    if (role === "admin" && adminCode !== ADMIN_SIGNUP_CODE) {
      state.formError = "رمز تفعيل حساب الإدارة غير صحيح."; render(); return;
    }
    state.saving = true; render();
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(cred.user.uid).set({ name, role });
      if (role === "admin") await seedDefaultClassesIfEmpty();
      state.draft = { name: "", email: "", password: "", classId: "", adminCode: "" };
      // onAuthStateChanged picks up the rest
    } catch (e) {
      state.formError = (AUTH_ERR[e.code] || "تعذر إنشاء الحساب.") + (e.code ? ` (${e.code})` : "");
      state.saving = false; render();
    }
  },
  async login(form) {
    state.formError = "";
    const { email, password } = form;
    if (!email || !password) { state.formError = "الرجاء تعبئة البريد وكلمة المرور."; render(); return; }
    state.saving = true; render();
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      state.formError = (AUTH_ERR[e.code] || "تعذر تسجيل الدخول.") + (e.code ? ` (${e.code})` : "");
      state.saving = false; render();
    }
  },
  // Family browsing needs no account — sign in anonymously (satisfies Firestore's
  // "request.auth != null" read rule) and keep the chosen class only in memory.
  async browseFamily(classId) {
    state.formError = "";
    if (!classId) { state.formError = "الرجاء اختيار الصف."; render(); return; }
    state.profile = { role: "family", name: "طالبة / ولي أمر", classId };

        attachListeners();

        await auth.signInAnonymously();
      }
    } catch (e) {
      state.profile = null;
      const hint = e.code === "auth/admin-restricted-operation"
        ? " (فعّلي Anonymous من Firebase Console > Authentication > Sign-in method)"
        : "";
      state.formError = (AUTH_ERR[e.code] || "تعذر تحميل التكليفات.") + hint + (e.code ? ` (${e.code})` : "");

  setLoginMode(m) { state.loginMode = m; state.formError = ""; render(); },
  setLoginRole(r) {

  flashShareMsg(msg) {
    state.shareMsg = msg;
    render();
    setTimeout(() => { state.shareMsg = ""; render(); }, 2500);
  },
  async shareWeekSummary() {
    if (typeof html2pdf === "undefined") {
      app.flashShareMsg("تعذّر تحميل أداة PDF من الإنترنت — تأكدي من الاتصال وأعيدي المحاولة.");
      return;
    }
    app.flashShareMsg("جارٍ تجهيز ملف PDF…");
    try {
      const className = (state.classes.find((c) => c.id === state.profile.classId) || {}).label || "الصف";
      const fileName = `تكليفات-${className}.pdf`.replace(/\s+/g, "-");
      const cap = mountCapturableEl(buildFamilySummaryReportHTML());
      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

      const worker = html2pdf().set({
        margin: 0,
        filename: fileName,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "pt", format: "a4", orientation: "portrait" },
      }).from(cap.el).toPdf();
      const blob = await worker.output("blob");
      cap.remove();

      const file = new File([blob], fileName, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        state.shareMsg = ""; render();
      } else {
        // iOS Safari's <a download> on blob URLs is unreliable and throws
        // "WebKitBlobResource error 1" — opening the blob directly lets
        // Safari's built-in PDF viewer handle it, with Save/Share from there.
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        app.flashShareMsg("افتح قائمة المشاركة من أعلى صفحة الملف لحفظه");
      }
    } catch (e) {
      app.flashShareMsg("تعذر إنشاء ملف PDF: " + (e && e.message ? e.message : String(e)));

// Finds the Sun–Thu school week containing a given date, and per-day totals.
function weekDatesFor(dateStr) {
  const base = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
  const start = startOfWeek(base);
  return WEEKDAYS.map((_, i) => addDays(start, i));
}
function dayLoad(classId, dateStr) {
  const items = state.assignments.filter((a) => a.classId === classId && a.dueDate === dateStr);
  const minutes = items.reduce((s, a) => s + Number(a.estMinutes || 0), 0);
  const heavyCount = items.filter((a) => typeWeight(a.type) >= 3).length;
  return { minutes, heavyCount };
}
// Live warning shown in the teacher's assignment form: if the chosen day would
// become "heavy" for that class, suggest the lightest alternative day this week.
// Per-class warning (used internally); returns "" if that class/day isn't heavy.
function computeLoadWarningHTML(classId, dueDate, type, estMinutes) {
  if (!classId || !dueDate) return "";
  const addMinutes = Number(estMinutes || 0);
  const addHeavy = typeWeight(type) >= 3 ? 1 : 0;
  const current = dayLoad(classId, dueDate);
  const projected = { minutes: current.minutes + addMinutes, heavyCount: current.heavyCount + addHeavy };
  const level = loadLevel(projected.minutes, projected.heavyCount);
  if (level.label !== "مرتفع") return "";

  let best = null;
  for (const d of weekDatesFor(dueDate)) {
    const key = fmtDate(d);
    if (key === dueDate) continue;
    const existing = dayLoad(classId, key);
    const proj = { minutes: existing.minutes + addMinutes, heavyCount: existing.heavyCount + addHeavy };
    const lvl = loadLevel(proj.minutes, proj.heavyCount);
    if (lvl.label !== "مرتفع" && (!best || proj.minutes < best.minutes)) {
      best = { day: WEEKDAYS[d.getDay()], minutes: proj.minutes };
    }
  }
  const className = (state.classes.find((c) => c.id === classId) || {}).label || "";
  const suggestion = best
    ? `جربي يوم <strong>${best.day}</strong> بدلاً منه — العبء المتوقع فيه أخف.`
    : `كل أيام هذا الأسبوع مزدحمة لهذا الصف — يُفضّل التنسيق مع باقي المعلمات.`;

  return `<div style="margin:0 0 10px;padding:12px 14px;border-radius:10px;background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;font-size:13px;line-height:1.8">
    ⚠️ <strong>${esc(className)}</strong>: هذا اليوم مزدحم (${projected.minutes} دقيقة${projected.heavyCount ? `، ${projected.heavyCount} اختبار/مشروع` : ""}). ${suggestion}
  </div>`;
}
// Combines the per-class warning across every class the teacher has selected.
function computeLoadWarningHTMLMulti(classIds, dueDate, type, estMinutes) {
  return classIds.map((id) => computeLoadWarningHTML(id, dueDate, type, estMinutes)).join("");
}

// Builds a plain-text weekly digest a parent can share themselves (WhatsApp, SMS, etc.)
function buildFamilySummaryText() {
  const classId = state.profile.classId;
  const className = (state.classes.find((c) => c.id === classId) || {}).label || "";
  const weekDates = weekDatesFor(fmtDate(new Date()));
  const mine = state.assignments.filter((a) => a.classId === classId);
  const lines = [`📋 ملخص تكليفات ${className} — ${SCHOOL_NAME}`, `عبر تطبيق توازن`, ""];
  let total = 0;
  weekDates.forEach((d) => {
    const key = fmtDate(d);
    const items = mine.filter((a) => a.dueDate === key);
    if (items.length === 0) return;
    lines.push(`• ${WEEKDAYS[d.getDay()]} (${fmtLabel(d)}):`);
    items.forEach((a) => {
      lines.push(`   - ${typeLabel(a.type)}: ${a.subject} — ${a.title} (${a.estMinutes} د)${a.link ? ` — ${a.link}` : ""}`);
      total++;
    });
  });
  if (total === 0) lines.push("لا توجد تكليفات مسجّلة هذا الأسبوع.");
  return lines.join("\n");
}

// ---- Admin compliance report ----
function schoolDaysInRange(fromStr, toStr) {
  const start = new Date(fromStr + "T00:00:00");
  const end = new Date(toStr + "T00:00:00");
  const days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    if (d.getDay() <= 4) days.push(new Date(d)); // Sun(0)–Thu(4) are school days
  }
  return days;
}
function computeComplianceReport(fromStr, toStr) {
  const days = schoolDaysInRange(fromStr, toStr);
  const perClass = state.classes.map((c) => {
    let light = 0, medium = 0, heavy = 0, totalMinutes = 0, totalAssign = 0;
    const typeCounts = { homework: 0, quiz: 0, project: 0 };
    days.forEach((d) => {
      const key = fmtDate(d);
      const items = state.assignments.filter((a) => a.classId === c.id && a.dueDate === key);
      const minutes = items.reduce((s, a) => s + Number(a.estMinutes || 0), 0);
      const heavyCount = items.filter((a) => typeWeight(a.type) >= 3).length;
      const lvl = loadLevel(minutes, heavyCount).label;
      if (lvl === "مرتفع") heavy++; else if (lvl === "متوسط") medium++; else if (lvl === "خفيف") light++;
      totalMinutes += minutes;
      totalAssign += items.length;
      items.forEach((a) => { if (typeCounts[a.type] !== undefined) typeCounts[a.type]++; });
    });
    const schoolDaysCount = days.length;
    const compliance = schoolDaysCount ? Math.round(((schoolDaysCount - heavy) / schoolDaysCount) * 100) : 100;
    return { ...c, light, medium, heavy, totalMinutes, totalAssign, typeCounts, compliance, schoolDaysCount };
  });
  const overallCompliance = perClass.length
    ? Math.round(perClass.reduce((s, c) => s + c.compliance, 0) / perClass.length)
    : 100;
  return { perClass, overallCompliance, days };
}
// Teacher usage is derived from the assignments themselves (createdAt + teacherName),
// since Firestore rules intentionally keep the users collection private per-account.
function computeTeacherUsage(fromStr, toStr) {
  const start = new Date(fromStr + "T00:00:00");
  const end = new Date(toStr + "T23:59:59");
  const byTeacher = {};
  state.assignments.forEach((a) => {
    const created = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : null;
    if (!created || created < start || created > end) return;
    const key = a.teacherUid || a.teacherName || "غير معروف";
    if (!byTeacher[key]) byTeacher[key] = { name: a.teacherName || "غير معروف", count: 0 };
    byTeacher[key].count++;
  });
  return Object.values(byTeacher).sort((a, b) => b.count - a.count);
}

        <div style="font-size:11.5px;color:#5B6478;margin-top:2px">${esc(SCHOOL_NAME)}</div>

    <div style="font-size:12px;color:#5B6478;margin-bottom:18px">من ${fmtAr(fromStr)} إلى ${fmtAr(toStr)}</div>

        نسبة الأيام الدراسية التي لم يُسجَّل فيها ازدحام (اختباران فأكثر أو تجاوز الحد الأقصى للوقت) عبر كل الصفوف خلال الفترة.

    </div>

    <div style="font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px">الالتزام حسب الصف (من الأقل التزاماً)</div>
    ${rows || `<p style="font-size:13px;color:#9AA3AF">لا توجد صفوف مسجّلة.</p>`}

    <div style="font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;margin:26px 0 10px;padding-top:16px;border-top:1px solid #F0EBE0">
      استخدام المعلمات خلال الفترة
    </div>
    <div style="font-size:12.5px;color:#5B6478;margin-bottom:10px">
      ${teachers.length} معلّمة${teachers.length === 1 ? "" : "ات"} استخدمن النظام وأضفن تكليفات خلال هذه الفترة.
    </div>
    ${teachers.length ? `<div>
      ${teachers.map((t) => `

  </div>`;

function renderAdmin() {
  const weekStart = startOfWeek(new Date());
  const weekDates = WEEKDAYS.map((_, i) => addDays(weekStart, i));
  const loadByClassDay = {};
  state.classes.forEach((c) => {
    loadByClassDay[c.id] = weekDates.map((d) => {
      const key = fmtDate(d);

      const minutes = items.reduce((s, a) => s + Number(a.estMinutes || 0), 0);
      const heavyCount = items.filter((a) => typeWeight(a.type) >= 3).length;
      return { minutes, heavyCount };
    });

  const flagged = state.classes.map((c) => {
    const vals = loadByClassDay[c.id] || [];
    const heavyDays = vals.filter((v) => loadLevel(v.minutes, v.heavyCount).label === "مرتفع").length;
    return { ...c, heavyDays };

  return `
  <div class="card">
    <h2 class="card-title">نبض العبء الأسبوعي لكل صف</h2>
    <p class="muted">يجمع الوقت المقدّر مع عدد الاختبارات/المشاريع في نفس اليوم — يومان أو أكثر من الاختبارات في نفس اليوم يُصنَّف مرتفعاً تلقائياً.</p>

            const lvl = loadLevel(v.minutes, v.heavyCount);

            return `<td><div class="pulse-cell" title="${v.minutes} دقيقة، ${v.heavyCount} اختبار/مشروع — ${lvl.label}">
              <div class="pulse-dot" style="background:${lvl.color};width:${size}px;height:${size}px"></div>
              <span class="pulse-val">${v.minutes || "—"}${v.heavyCount > 0 ? ` (${v.heavyCount})` : ""}</span>
            </div></td>`;
          }).join("")}
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="card-title">صفوف تحتاج متابعة</h2>
    ${flagged.length === 0 ? `<p class="muted">لا يوجد ازدحام ملحوظ هذا الأسبوع. ✓</p>` : `<ul class="list">
      ${flagged.map((f) => `<li class="list-item"><div>
        <div class="list-item-title">⚠️ ${esc(f.label)}</div>
        <div class="list-item-meta">${f.heavyDays} يوم/أيام بعبء مرتفع هذا الأسبوع</div>
      </div></li>`).join("")}
    </ul>`}
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="card-title">تقرير الالتزام بتوزيع العبء</h2>
    <p class="muted">تقرير رسمي بصيغة PDF يوضح مدى التزام كل صف بتوازن العبء الدراسي، وعدد المعلمات اللي استخدمن النظام وأسماءهن، خلال أي فترة تحددينها (شهر، فصل دراسي، أو مدى مخصّص).</p>
    <form id="reportForm">
      <div class="row2">
        <label class="field">من تاريخ<input type="date" name="from" value="${fmtDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1))}" /></label>
        <label class="field">إلى تاريخ<input type="date" name="to" value="${fmtDate(new Date())}" /></label>
      </div>
      <button type="submit" class="btn-primary" ${state.saving ? "disabled" : ""}>📄 تحميل تقرير PDF</button>
    </form>
    ${state.shareMsg ? `<p class="muted" style="margin-top:10px;color:#0F766E">${esc(state.shareMsg)}</p>` : ""}
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="card-title">إدارة قائمة الصفوف</h2>
    <form id="classForm" style="display:flex;gap:8px;margin-bottom:14px">
      <input name="label" placeholder="مثال: الأول ثانوي / 2" style="flex:1" />
      <button type="submit" class="btn-primary" style="width:auto;margin-top:0;white-space:nowrap">+ إضافة صف</button>
    </form>
    <ul class="list">
      ${state.classes.map((c) => `<li class="list-item">
        <span class="list-item-title">${esc(c.label)}</span>
        <button class="icon-btn" onclick="app.removeClass('${c.id}')">✕</button>
      </li>`).join("")}
    </ul>
  </div>
  <p class="muted" style="margin-top:12px">إجمالي التكليفات المسجّلة: ${state.assignments.length}</p>
  `;
}

function bindAppEvents() {
  const assignForm = document.getElementById("assignForm");
  if (assignForm) {
    const classRow = document.getElementById("classRow");
    const typeRow = document.getElementById("typeRow");
    const warningBox = document.getElementById("loadWarning");
    const getSelectedClasses = () => JSON.parse(classRow.dataset.value || "[]");
    const refreshWarning = () => {
      const fd = new FormData(assignForm);
      warningBox.innerHTML = computeLoadWarningHTMLMulti(
        getSelectedClasses(), fd.get("dueDate"), typeRow.dataset.value, fd.get("estMinutes")
      );
    };
    classRow.addEventListener("click", (e) => {
      const btn = e.target.closest(".type-pill");
      if (!btn) return;
      const ids = getSelectedClasses();
      const id = btn.dataset.class;
      const idx = ids.indexOf(id);
      if (idx === -1) ids.push(id); else ids.splice(idx, 1);
      classRow.dataset.value = JSON.stringify(ids);
      btn.classList.toggle("active", ids.includes(id));
      refreshWarning();
    });
    typeRow.addEventListener("click", (e) => {
      const btn = e.target.closest(".type-pill");
      if (!btn) return;
      typeRow.dataset.value = btn.dataset.type;
      [...typeRow.children].forEach((b) => b.classList.toggle("active", b === btn));
      refreshWarning();
    });
    assignForm.addEventListener("input", (e) => {
      if (["dueDate", "estMinutes"].includes(e.target.name)) refreshWarning();
    });
    assignForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(assignForm);
      const title = (fd.get("title") || "").trim();
      const dueDate = fd.get("dueDate");
      const classIds = getSelectedClasses();
      if (!title || !dueDate || classIds.length === 0) {
        if (classIds.length === 0) warningBox.innerHTML = `<p style="color:#DC2626;font-size:13px;margin:0 0 10px">اختاري صفاً واحداً على الأقل.</p>`;
        return;
      }
      app.addAssignment({
        classIds, subject: fd.get("subject"), type: typeRow.dataset.value,
        title, dueDate, estMinutes: Number(fd.get("estMinutes") || 0),
        link: (fd.get("link") || "").trim(),
      });
      assignForm.reset();
      classRow.dataset.value = "[]";
      [...classRow.children].forEach((b) => b.classList.remove("active"));
      warningBox.innerHTML = "";
    });
  }
  const classForm = document.getElementById("classForm");
  if (classForm) {
    classForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(classForm);
      app.addClass(fd.get("label") || "");
      classForm.reset();
    });
  }
  const reportForm = document.getElementById("reportForm");
  if (reportForm) {
    reportForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(reportForm);
      const from = fd.get("from"), to = fd.get("to");
      if (!from || !to) return;
      app.downloadComplianceReport(from, to);
    });
  }
}

// initial paint
render();
</script>
