<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>توازن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0; --ink:#1F2A44; --ink-soft:#5B6478; --teal:#0F766E; --teal-deep:#0B5750;
    --gold:#C89B3C; --amber:#D97706; --red:#DC2626; --line:#E4DDD0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif}
  h1,h2,.display{font-family:'Cairo',sans-serif}
  #root{min-height:100vh;display:flex}
  .spine{width:44px;background:linear-gradient(180deg,var(--teal),var(--teal-deep));display:flex;flex-direction:column;align-items:center;padding-top:24px;gap:40px;flex-shrink:0}
  .spine span{writing-mode:vertical-rl;color:var(--paper);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;opacity:.85}
  .main{flex:1;padding:28px 32px 60px;max-width:1100px;margin:0 auto;width:100%}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:20px}
  .eyebrow{font-size:13px;color:var(--teal);font-weight:700;margin-bottom:4px}
  .title{font-size:28px;font-weight:800;margin:0}
  .userbox{display:flex;align-items:center;gap:14px}
  .userinfo{display:flex;flex-direction:column;align-items:flex-end}
  .username{font-weight:700;font-size:14px}
  .userrole{font-size:12px;color:var(--ink-soft)}
  button{cursor:pointer;font-family:'Tajawal',sans-serif}
  .btn-ghost{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;width:100%;margin-top:4px}
  .btn-primary:disabled{opacity:.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .card-title{font-size:18px;font-weight:700;margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:500;margin-bottom:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--ink);background:var(--paper);width:100%}
  .list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
  .list-item-title{font-weight:700;font-size:14px}
  .list-item-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .icon-btn{background:transparent;border:none;color:var(--red);padding:6px;font-size:16px}
  .muted{color:var(--ink-soft);font-size:13.5px}
  .role-switch{display:flex;gap:8px;background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line)}
  .role-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);font-weight:500;font-size:14px}
  .role-pill.active{background:var(--teal);color:#fff}
  .type-row{display:flex;gap:8px}
  .type-pill{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:13px;font-weight:500}
  .type-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;max-width:400px;width:100%}
  .mode-switch{display:flex;border-bottom:1px solid var(--line)}
  .mode-tab{flex:1;padding:10px 0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);font-weight:700;font-size:14px}
  .mode-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
  .error-banner{background:#FEE2E2;color:#991B1B;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px}
  .setup-banner{background:#FFF7E6;border:1px solid var(--gold);color:#7A5B14;padding:16px 18px;border-radius:10px;margin-bottom:20px;font-size:13.5px;line-height:1.9}
  .setup-banner code{background:#fff;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse}
  th{text-align:center;padding:8px 10px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
  td{text-align:center;padding:10px;border-bottom:1px solid #F0EBE0}
  .pulse-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .pulse-dot{border-radius:50%;transition:all .3s;margin:0 auto}
  .pulse-val{font-size:11px;color:var(--ink-soft)}
  .spin{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================================================================
   الخطوة ١ — لصق إعدادات مشروعك في Firebase هنا
   من Firebase Console: Project settings > عام > تطبيقاتك > SDK setup
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBl2_3Q3s1azbFnx6X5ZRq_X1hYnw0Bz_k",
  authDomain: "tawazon-school.firebaseapp.com",
  projectId: "tawazon-school",
  storageBucket: "tawazon-school.firebasestorage.app",
  messagingSenderId: "999233535675",
  appId: "1:999233535675:web:73d87e3c8963c7a6ae739e",
};

const CONFIG_READY = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

const DEFAULT_CLASSES = [
  "الأول متوسط / 1", "الأول متوسط / 2", "الثاني متوسط / 1",
  "الثاني متوسط / 2", "الثالث متوسط / 1", "الثالث ثانوي / 1",
];

const SUBJECTS = ["اللغة الإنجليزية", "الرياضيات", "العلوم", "اللغة العربية", "الدراسات الإسلامية", "الاجتماعيات"];
const TYPES = [
  { key: "homework", label: "واجب", weight: 1 },
  { key: "quiz", label: "اختبار", weight: 3 },
  { key: "project", label: "مشروع", weight: 3 },
];
const typeLabel = (k) => (TYPES.find((t) => t.key === k) || TYPES[0]).label;
const typeWeight = (k) => (TYPES.find((t) => t.key === k) || TYPES[0]).weight;
const WEEKDAYS = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
const ROLE_LABEL = { teacher: "معلّمة", family: "طالبة / ولي أمر", admin: "الإدارة" };

// Admin registration is gated by a simple shared passphrase since this demo
// has no server-side invite system yet. Change it before sharing the file.
const ADMIN_SIGNUP_CODE = "school-admin-2026";

function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) { return d.toISOString().slice(0, 10); }
function fmtLabel(d) { return d.toLocaleDateString("ar-SA", { day: "numeric", month: "short" }); }
function loadLevel(minutes, heavyCount) {
  if (heavyCount >= 2 || minutes > 120) return { label: "مرتفع", color: "#DC2626" };
  if (heavyCount === 1 || minutes > 60) return { label: "متوسط", color: "#C89B3C" };
  if (minutes > 0) return { label: "خفيف", color: "#0F766E" };
  return { label: "لا يوجد", color: "#C7C0AE" };
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------------------------------------------------------------------
// App state + Firebase wiring
// ---------------------------------------------------------------------
const state = {
  screen: CONFIG_READY ? "loading" : "setup",
  authUser: null,
  profile: null,       // { name, role, classId }
  classes: [],          // [{id,label}]
  assignments: [],       // [{id,...}]
  loginMode: "login",
  loginRole: "teacher",
  draft: { name: "", email: "", password: "", classId: "", adminCode: "" },
  error: "",
  formError: "",
  saving: false,
};

let auth, db, unsubClasses, unsubAssignments;

if (CONFIG_READY) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();

  auth.onAuthStateChanged(async (user) => {
    state.authUser = user;
    if (!user) {
      teardownListeners();
      state.profile = null;
      state.screen = "login";
      render();
      return;
    }
    try {
      const snap = await db.collection("users").doc(user.uid).get();
      if (!snap.exists) {
        // profile wasn't written yet (rare race) — sign out to avoid a broken state
        await auth.signOut();
        return;
      }
      state.profile = snap.data();
      attachListeners();
      state.screen = "app";
    } catch (e) {
      state.error = "تعذر تحميل بيانات الحساب.";
      state.screen = "login";
    }
    render();
  });
}

function attachListeners() {
  teardownListeners();
  unsubClasses = db.collection("classes").orderBy("label").onSnapshot(
    (qs) => { state.classes = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => { state.error = "تعذر تحميل قائمة الصفوف — تحققي من قواعد الأمان في Firestore."; render(); }
  );
  unsubAssignments = db.collection("assignments").orderBy("dueDate").onSnapshot(
    (qs) => { state.assignments = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => { state.error = "تعذر تحميل التكليفات — تحققي من قواعد الأمان في Firestore."; render(); }
  );
}
function teardownListeners() {
  if (unsubClasses) unsubClasses();
  if (unsubAssignments) unsubAssignments();
}

async function seedDefaultClassesIfEmpty() {
  const snap = await db.collection("classes").limit(1).get();
  if (snap.empty) {
    const batch = db.batch();
    DEFAULT_CLASSES.forEach((label) => batch.set(db.collection("classes").doc(), { label }));
    await batch.commit();
  }
}

const AUTH_ERR = {
  "auth/email-already-in-use": "هذا البريد مسجّل مسبقاً — جرّبي تسجيل الدخول.",
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
  "auth/weak-password": "كلمة المرور قصيرة جداً (٦ أحرف على الأقل).",
  "auth/wrong-password": "كلمة المرور غير صحيحة.",
  "auth/user-not-found": "لا يوجد حساب بهذا البريد.",
  "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
  "auth/too-many-requests": "محاولات كثيرة، حاولي بعد قليل.",
  "auth/network-request-failed": "تعذر الاتصال بالخادم — افتحي الملف في Safari (وليس داخل معاينة المحادثة) وتأكدي من اتصال الإنترنت.",
  "auth/unauthorized-domain": "هذا الرابط غير مصرّح له بالدخول — أضيفي النطاق في Firebase Console من Authentication > Settings > Authorized domains.",
};

const app = {
  async register(form) {
    state.formError = "";
    const { email, password, name, role, classId, adminCode } = form;
    if (!email || !password || !name) { state.formError = "الرجاء تعبئة كل الحقول."; render(); return; }
    if (role === "admin" && adminCode !== ADMIN_SIGNUP_CODE) {
      state.formError = "رمز تفعيل حساب الإدارة غير صحيح."; render(); return;
    }
    if (role === "family" && !classId) { state.formError = "الرجاء اختيار الصف."; render(); return; }
    state.saving = true; render();
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const profile = { name, role };
      if (role === "family") profile.classId = classId;
      await db.collection("users").doc(cred.user.uid).set(profile);
      if (role === "admin") await seedDefaultClassesIfEmpty();
      state.draft = { name: "", email: "", password: "", classId: "", adminCode: "" };
      // onAuthStateChanged picks up the rest
    } catch (e) {
      state.formError = (AUTH_ERR[e.code] || "تعذر إنشاء الحساب.") + (e.code ? ` (${e.code})` : "");
      state.saving = false; render();
    }
  },
  async login(form) {
    state.formError = "";
    const { email, password } = form;
    if (!email || !password) { state.formError = "الرجاء تعبئة البريد وكلمة المرور."; render(); return; }
    state.saving = true; render();
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      state.formError = (AUTH_ERR[e.code] || "تعذر تسجيل الدخول.") + (e.code ? ` (${e.code})` : "");
      state.saving = false; render();
    }
  },
  logout() { auth.signOut(); },
  setLoginMode(m) { state.loginMode = m; state.formError = ""; render(); },
  setLoginRole(r) { state.loginRole = r; state.formError = ""; render(); },


  async addAssignment(a) {
    state.saving = true; render();
    try {
      await db.collection("assignments").add({
        ...a, teacherUid: state.authUser.uid, teacherName: state.profile.name,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (e) { state.error = "تعذر حفظ التكليف."; }
    state.saving = false; render();
  },
  async removeAssignment(id) {
    try { await db.collection("assignments").doc(id).delete(); }
    catch (e) { state.error = "تعذر حذف التكليف."; render(); }
  },
  async addClass(label) {
    if (!label.trim()) return;
    try { await db.collection("classes").add({ label: label.trim() }); }
    catch (e) { state.error = "تعذر إضافة الصف."; render(); }
  },
  async removeClass(id) {
    try { await db.collection("classes").doc(id).delete(); }
    catch (e) { state.error = "تعذر حذف الصف."; render(); }
  },
};

// ---------------------------------------------------------------------
// Rendering (template-string based, event delegation via onclick handlers)
// ---------------------------------------------------------------------
const root = document.getElementById("root");
function render() {
  if (state.screen === "setup") { root.innerHTML = renderSetup(); return; }
  if (state.screen === "loading") { root.innerHTML = renderLoading(); return; }
  if (state.screen === "login") { root.innerHTML = renderLogin(); bindLoginEvents(); return; }
  root.innerHTML = renderApp();
  bindAppEvents();
}

function renderSetup() {
  return `<div class="center-screen"><div class="login-card" style="max-width:520px">
    <div class="eyebrow">حين يتوازن الجهد، يتّسع للتعلّم</div>
    <h1 class="title">إعداد الاتصال بـ Firebase</h1>
    <div class="setup-banner" style="margin-top:16px">
      لم يتم ضبط <code>firebaseConfig</code> بعد في أعلى ملف الكود.<br/>
      افتحي ملف <code>school-planner-firebase.html</code>، وابحثي عن السطر
      <code>const firebaseConfig = {...}</code> في بداية الكود، واستبدلي القيم
      بمعلومات مشروعك من Firebase Console، ثم احفظي الملف وأعيدي فتحه.
    </div>
  </div></div>`;
}
function renderLoading() {
  return `<div class="center-screen"><span class="spin display" style="font-size:24px;color:var(--teal)">⏳</span></div>`;
}

function renderLogin() {
  const roles = [["teacher", "معلّمة"], ["family", "طالبة / ولي أمر"], ["admin", "الإدارة"]];
  const classOptions = state.classes.length
    ? state.classes.map((c) => `<option value="${c.id}">${esc(c.label)}</option>`).join("")
    : DEFAULT_CLASSES.map((l) => `<option value="">${esc(l)} (ستُضاف تلقائياً عند أول حساب إدارة)</option>`).join("");

  return `<div class="login-wrap"><div class="login-card">
    <div class="eyebrow">حين يتوازن الجهد، يتّسع للتعلّم</div>
    <h1 class="title">توازن</h1>

    <div class="role-switch" style="margin:18px 0">
      ${roles.map(([k, l]) => `<button class="role-pill ${state.loginRole === k ? "active" : ""}" onclick="app.setLoginRole('${k}')">${l}</button>`).join("")}
    </div>

    <div class="mode-switch">
      <button class="mode-tab ${state.loginMode === "login" ? "active" : ""}" onclick="app.setLoginMode('login')">تسجيل الدخول</button>
      <button class="mode-tab ${state.loginMode === "register" ? "active" : ""}" onclick="app.setLoginMode('register')">حساب جديد</button>
    </div>

    <form id="authForm" style="margin-top:16px">
      ${state.loginMode === "register" ? `
      <label class="field">الاسم الظاهر
        <input name="name" value="${esc(state.draft.name)}" placeholder="${state.loginRole === "teacher" ? "مثال: أ. نهى المطيري" : "اسمك"}" />
      </label>` : ""}
      <label class="field">البريد الإلكتروني
        <input name="email" type="email" value="${esc(state.draft.email)}" placeholder="name@example.com" />
      </label>
      <label class="field">كلمة المرور
        <input name="password" type="password" value="${esc(state.draft.password)}" />
      </label>
      ${state.loginMode === "register" && state.loginRole === "family" ? `
      <label class="field">الصف
        <select name="classId">${classOptions}</select>
      </label>` : ""}
      ${state.loginMode === "register" && state.loginRole === "admin" ? `
      <label class="field">رمز تفعيل حساب الإدارة
        <input name="adminCode" type="password" value="${esc(state.draft.adminCode)}" placeholder="من مسؤول النظام" />
      </label>` : ""}
      ${state.formError ? `<p style="color:#DC2626;font-size:13px;margin:0 0 10px">${esc(state.formError)}</p>` : ""}
      <button type="submit" class="btn-primary" ${state.saving ? "disabled" : ""}>
        ${state.loginMode === "login" ? "دخول" : "إنشاء الحساب"}
      </button>
    </form>
    <p class="muted" style="margin-top:14px;font-size:12px">
      الحسابات وكلمات المرور تُدار عبر Firebase Authentication الحقيقي، والبيانات تُحفظ بشكل دائم في Firestore.
    </p>
  </div></div>`;
}

function bindLoginEvents() {
  const form = document.getElementById("authForm");
  if (!form) return;
  form.addEventListener("input", (e) => {
    const { name, value } = e.target;
    if (name && name in state.draft) state.draft[name] = value;
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
      email: (fd.get("email") || "").trim(),
      password: fd.get("password") || "",
      name: (fd.get("name") || "").trim(),
      role: state.loginRole,
      classId: fd.get("classId") || "",
      adminCode: fd.get("adminCode") || "",
    };
    if (state.loginMode === "login") app.login(payload);
    else app.register(payload);
  });
}

function renderApp() {
  const roleLabel = ROLE_LABEL[state.profile.role];
  return `
    <div class="spine">
      <span>المعلمات</span><span>الطالبات وأولياء الأمور</span><span>الإدارة</span>
    </div>
    <div class="main">
      <header class="top">
        <div><div class="eyebrow">حين يتوازن الجهد، يتّسع للتعلّم</div><h1 class="title">توازن</h1></div>
        <div class="userbox">
          <div class="userinfo"><span class="username">${esc(state.profile.name)}</span><span class="userrole">${roleLabel}</span></div>
          <button class="btn-ghost" onclick="app.logout()">تسجيل الخروج</button>
        </div>
      </header>
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ""}
      <div id="viewRoot">${renderRoleView()}</div>
    </div>
  `;
}

function renderRoleView() {
  if (state.profile.role === "teacher") return renderTeacher();
  if (state.profile.role === "family") return renderFamily();
  return renderAdmin();
}

function renderTeacher() {
  const mine = state.assignments.filter((a) => a.teacherUid === state.authUser.uid);
  const classOpts = state.classes.map((c) => `<option value="${c.id}">${esc(c.label)}</option>`).join("");
  const subjOpts = SUBJECTS.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  return `
  <div class="grid2">
    <form id="assignForm" class="card">
      <h2 class="card-title">إضافة تكليف جديد</h2>
      <div class="row2">
        <label class="field">الصف<select name="classId">${classOpts}</select></label>
        <label class="field">المادة<select name="subject">${subjOpts}</select></label>
      </div>
      <label class="field">نوع التكليف
        <div class="type-row" id="typeRow" data-value="homework">
          ${TYPES.map((t) => `<button type="button" class="type-pill ${t.key === "homework" ? "active" : ""}" data-type="${t.key}">${t.label}</button>`).join("")}
        </div>
      </label>
      <label class="field">عنوان التكليف<input name="title" placeholder="مثال: أوراق عمل الوحدة الثالثة" /></label>
      <div class="row2">
        <label class="field">تاريخ التسليم<input name="dueDate" type="date" /></label>
        <label class="field">الوقت المتوقع (دقيقة)<input name="estMinutes" type="number" min="5" max="240" step="5" value="20" /></label>
      </div>
      <button type="submit" class="btn-primary" ${state.saving ? "disabled" : ""}>+ نشر التكليف</button>
    </form>
    <div class="card">
      <h2 class="card-title">تكليفاتك</h2>
      ${mine.length === 0 ? `<p class="muted">لا توجد تكليفات بعد.</p>` : `<ul class="list">
        ${mine.slice(0, 12).map((a) => `
          <li class="list-item">
            <div><div class="list-item-title">${typeLabel(a.type)} · ${esc(a.title)}</div>
            <div class="list-item-meta">${esc((state.classes.find((c) => c.id === a.classId) || {}).label || "")} · ${esc(a.subject)} · ${esc(a.dueDate)} · ${esc(a.estMinutes)} د</div></div>
            <button class="icon-btn" onclick="app.removeAssignment('${a.id}')">✕</button>
          </li>`).join("")}
      </ul>`}
    </div>
  </div>`;
}

function renderFamily() {
  const classId = state.profile.classId;
  const className = (state.classes.find((c) => c.id === classId) || {}).label || "—";
  const weekStart = startOfWeek(new Date());
  const weekDates = WEEKDAYS.map((_, i) => addDays(weekStart, i));
  const mine = state.assignments.filter((a) => a.classId === classId).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return `
  <div class="card"><span class="muted">الصف المسجّل: </span><span class="list-item-title" style="font-size:15px">${esc(className)}</span></div>
  <div style="display:grid;gap:12px;margin-top:16px">
    ${weekDates.map((d) => {
      const key = fmtDate(d);
      const items = mine.filter((a) => a.dueDate === key);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <span class="display" style="font-weight:700;font-size:15px">${WEEKDAYS[d.getDay()]}</span>
          <span class="muted">${fmtLabel(d)}</span>
        </div>
        ${items.length === 0 ? `<p class="muted">لا يوجد تكليفات هذا اليوم.</p>` : `<ul class="list">
          ${items.map((a) => `<li class="list-item"><div>
            <div class="list-item-title">${typeLabel(a.type)} · ${esc(a.title)}</div>
            <div class="list-item-meta">${esc(a.subject)} · ${esc(a.teacherName)} · ${esc(a.estMinutes)} د</div>
          </div></li>`).join("")}
        </ul>`}
      </div>`;
    }).join("")}
  </div>`;
}

function renderAdmin() {
  const weekStart = startOfWeek(new Date());
  const weekDates = WEEKDAYS.map((_, i) => addDays(weekStart, i));
  const loadByClassDay = {};
  state.classes.forEach((c) => {
    loadByClassDay[c.id] = weekDates.map((d) => {
      const key = fmtDate(d);
      const items = state.assignments.filter((a) => a.classId === c.id && a.dueDate === key);
      const minutes = items.reduce((s, a) => s + Number(a.estMinutes || 0), 0);
      const heavyCount = items.filter((a) => typeWeight(a.type) >= 3).length;
      return { minutes, heavyCount };
    });
  });
  const flagged = state.classes.map((c) => {
    const vals = loadByClassDay[c.id] || [];
    const heavyDays = vals.filter((v) => loadLevel(v.minutes, v.heavyCount).label === "مرتفع").length;
    return { ...c, heavyDays };
  }).filter((f) => f.heavyDays > 0).sort((a, b) => b.heavyDays - a.heavyDays);

  return `
  <div class="card">
    <h2 class="card-title">نبض العبء الأسبوعي لكل صف</h2>
    <p class="muted">يجمع الوقت المقدّر مع عدد الاختبارات/المشاريع في نفس اليوم — يومان أو أكثر من الاختبارات في نفس اليوم يُصنَّف مرتفعاً تلقائياً.</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>الصف</th>${weekDates.map((d) => `<th>${WEEKDAYS[d.getDay()]}</th>`).join("")}</tr></thead>
      <tbody>
        ${state.classes.map((c) => `<tr>
          <td style="font-weight:700">${esc(c.label)}</td>
          ${(loadByClassDay[c.id] || []).map((v) => {
            const lvl = loadLevel(v.minutes, v.heavyCount);
            const size = 10 + Math.min(v.minutes, 150) / 6;
            return `<td><div class="pulse-cell" title="${v.minutes} دقيقة، ${v.heavyCount} اختبار/مشروع — ${lvl.label}">
              <div class="pulse-dot" style="background:${lvl.color};width:${size}px;height:${size}px"></div>
              <span class="pulse-val">${v.minutes || "—"}${v.heavyCount > 0 ? ` (${v.heavyCount})` : ""}</span>
            </div></td>`;
          }).join("")}
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="card-title">صفوف تحتاج متابعة</h2>
    ${flagged.length === 0 ? `<p class="muted">لا يوجد ازدحام ملحوظ هذا الأسبوع. ✓</p>` : `<ul class="list">
      ${flagged.map((f) => `<li class="list-item"><div>
        <div class="list-item-title">⚠️ ${esc(f.label)}</div>
        <div class="list-item-meta">${f.heavyDays} يوم/أيام بعبء مرتفع هذا الأسبوع</div>
      </div></li>`).join("")}
    </ul>`}
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="card-title">إدارة قائمة الصفوف</h2>
    <form id="classForm" style="display:flex;gap:8px;margin-bottom:14px">
      <input name="label" placeholder="مثال: الأول ثانوي / 2" style="flex:1" />
      <button type="submit" class="btn-primary" style="width:auto;margin-top:0;white-space:nowrap">+ إضافة صف</button>
    </form>
    <ul class="list">
      ${state.classes.map((c) => `<li class="list-item">
        <span class="list-item-title">${esc(c.label)}</span>
        <button class="icon-btn" onclick="app.removeClass('${c.id}')">✕</button>
      </li>`).join("")}
    </ul>
  </div>
  <p class="muted" style="margin-top:12px">إجمالي التكليفات المسجّلة: ${state.assignments.length}</p>
  `;
}

function bindAppEvents() {
  const assignForm = document.getElementById("assignForm");
  if (assignForm) {
    const typeRow = document.getElementById("typeRow");
    typeRow.addEventListener("click", (e) => {
      const btn = e.target.closest(".type-pill");
      if (!btn) return;
      typeRow.dataset.value = btn.dataset.type;
      [...typeRow.children].forEach((b) => b.classList.toggle("active", b === btn));
    });
    assignForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(assignForm);
      const title = (fd.get("title") || "").trim();
      const dueDate = fd.get("dueDate");
      const classId = fd.get("classId");
      if (!title || !dueDate || !classId) return;
      app.addAssignment({
        classId, subject: fd.get("subject"), type: typeRow.dataset.value,
        title, dueDate, estMinutes: Number(fd.get("estMinutes") || 0),
      });
      assignForm.reset();
    });
  }
  const classForm = document.getElementById("classForm");
  if (classForm) {
    classForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(classForm);
      app.addClass(fd.get("label") || "");
      classForm.reset();
    });
  }
}

// initial paint
render();
</script>
</body>
</html>
